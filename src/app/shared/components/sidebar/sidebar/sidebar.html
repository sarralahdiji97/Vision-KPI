<div
  class="header-content"
  [ngClass]="{ 'app-sidebar-expended': isExpended }"
>
  <div class="layout-menu">

    <!-- ================= HEADER ================= -->
    <ul class="layout-menu-nav">

      <div class="menu-nav-header">

        <!-- Retour vers le portail -->
        <li class="icon-btn">
          <mat-icon
            [routerLink]="'/main/portal'"
            aria-label="Retour au portail"
          >
            arrow_back
          </mat-icon>
        </li>

        <!-- Portail -->
        <li class="icon-btn">
          <a [routerLink]="'/main/portal'">
            <mat-icon>widgets</mat-icon>
          </a>
        </li>

      </div>

    </ul>

    <!-- ================= SIDEBAR EXPANDED ================= -->
    <div class="layout-menu-content">

      <!-- ================= HEADER ================= -->
      <div class="menu-content-header">

        <div
          class="logo"
          [style.background-color]="data.iconBgColor"
        >
          <mat-icon>
            {{ data.iconPath }}
          </mat-icon>
        </div>

        <div class="title">
          <h1>{{ data.title }}</h1>
        </div>

      </div>

      <!-- ================= BODY ================= -->
      <div class="menu-content-body">

        <!-- ================= TREE ================= -->
        <mat-tree
          #sideMenu
          [dataSource]="dataSource"
          [childrenAccessor]="childrenAccessor"
          class="sidebar-tree"
        >

          <!-- ================= LEAF NODE ================= -->
          <mat-nested-tree-node
            *matTreeNodeDef="let node"
          >

            <div
              *ngIf="havePermission(node)"
              class="mat-node"
            >

              <button
                mat-icon-button
                disabled
                class="tree-spacer"
                aria-hidden="true"
              >
              </button>

              <div
                class="mat-node-link"
                [routerLink]="node.routerLink"
                routerLinkActive="mat-node-active"
              >
                {{ node.name }}

                <div class="mat-node-underline"></div>
              </div>

            </div>

          </mat-nested-tree-node>

          <!-- ================= PARENT NODE ================= -->
          <mat-nested-tree-node
            *matTreeNodeDef="let node; when: hasChild"
          >

            <div
              *ngIf="havePermission(node)"
              class="mat-node mat-parent-node"
            >

              <button
                mat-icon-button
                type="button"
                [attr.aria-label]="'Toggle ' + node.name"
                (click)="sideMenu.toggle(node)"
              >
                <mat-icon>
                  {{
                    !sideMenu.isExpanded(node)
                      ? 'expand_more'
                      : 'chevron_right'
                  }}
                </mat-icon>
              </button>

              <div
                class="mat-node-link"
                [routerLink]="node.routerLink"
                routerLinkActive="mat-node-active"
              >
                {{ node.name }}

                <div class="mat-node-underline"></div>
              </div>

            </div>

            <!-- ================= CHILDREN ================= -->
            <div
              [class.menu-tree-invisible]="sideMenu.isExpanded(node)"
              role="group"
            >
              <ng-container matTreeNodeOutlet></ng-container>
            </div>

          </mat-nested-tree-node>

        </mat-tree>

      </div>

    </div>

  </div>
</div>
